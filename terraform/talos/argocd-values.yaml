global:
  domain: argocd.0xk3m.dev

configs:
  cm:
    url: https://argocd.0xk3m.dev
    dex.config: |
      issuer: https://argocd.0xk3m.dev/api/dex
      connectors:
        - type: google
          id: google
          name: Google
          config:
            clientID: "${google_oauth_client_id}"
            clientSecret: "${google_oauth_client_secret}"
    resource.exclusions: |
      ### Network resources created by the Kubernetes control plane
      - apiGroups:
        - discovery.k8s.io
        kinds:
        - EndpointSlice
      ### Internal Kubernetes resources excluded reduce the number of watched events
      - apiGroups:
        - coordination.k8s.io
        kinds:
        - Lease
      ### Internal Kubernetes Authz/Authn resources
      - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
        kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
      ### Intermediate Certificate Request
      - apiGroups:
        - certificates.k8s.io
        kinds:
        - CertificateSigningRequest
      - apiGroups:
        - cert-manager.io
        kinds:
        - CertificateRequest
      ### Cilium internal resources
      - apiGroups:
        - cilium.io
        kinds:
        - CiliumIdentity
        - CiliumEndpoint
        - CiliumEndpointSlice
      ### Kyverno intermediate and reporting resources
      - apiGroups:
        - kyverno.io
        - reports.kyverno.io
        - wgpolicyk8s.io
        kinds:
        - PolicyReport
        - ClusterPolicyReport
        - EphemeralReport
        - ClusterEphemeralReport
        - AdmissionReport
        - ClusterAdmissionReport
        - BackgroundScanReport
        - ClusterBackgroundScanReport
        - UpdateRequest
  rbac:
    create: true
    policy.csv: |
      p, role:none, *, *, */*, deny
      g, khimnguynn@gmail.com, role:admin
      g, vanbachpk1@gmail.com, role:admin
    scopes: "[groups, email]"
    policy.default: role:none

extraObjects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: github-khiemnd
      namespace: argocd
      labels:
        argocd.argoproj.io/secret-type: repository
    type: Opaque
    stringData:
      url: https://github.com/khimnguynnn/0xk3m-homelabs.git
      type: git
      username: "${github_username}"
      password: "${github_token}"
  - apiVersion: v1
    kind: Secret
    metadata:
      name: chartmuseum
      namespace: argocd
      labels:
        argocd.argoproj.io/secret-type: repository
    type: Opaque
    stringData:
      name: chartmuseum
      url: https://charts.0xk3m.dev
      type: helm
      username: "${chartmuseum_username}"
      password: "${chartmuseum_password}"

controller:
  replicas: 1
  resources:
    limits:
      cpu: "500m"
      memory: 1Gi
    requests:
      cpu: "250m"
      memory: 256Mi
  metrics:
    enabled: true

server:
  replicas: 1
  service:
    type: ClusterIP
  extraArgs:
    - --insecure
  ingress:
    enabled: true
    ingressClassName: "cloudflare-tunnel"
    pathType: Prefix
  metrics:
    enabled: true

applicationSet:
  replicas: 1
  metrics:
    enabled: true

dex:
  enabled: true
  metrics:
    enabled: true

redis:
  enabled: true
  metrics:
    enabled: true

notifications:
  enabled: false
