open-webui:
  ollama:
    enabled: false
  pipelines:
    enabled: false
  enableOpenaiApi: true
  openaiBaseApiUrl: ""
  extraEnvVars:
    # S3 Storage
    - name: STORAGE_PROVIDER
      value: "s3"
    - name: S3_BUCKET_NAME
      valueFrom:
        secretKeyRef:
          name: open-webui-secrets
          key: s3BucketName
    - name: S3_REGION_NAME
      valueFrom:
        secretKeyRef:
          name: open-webui-secrets
          key: s3Region
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: open-webui-secrets
          key: s3AccessKeyId
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: open-webui-secrets
          key: s3SecretAccessKey

    # Google OIDC Authentication
    - name: WEBUI_URL
      value: "https://chat.0xk3m.dev"
    - name: ENABLE_OAUTH
      value: "true"
    - name: ENABLE_OAUTH_SIGNUP
      value: "true"
    - name: OAUTH_PROVIDER_NAME
      value: "Google"
    - name: OAUTH_SCOPES
      value: "openid email profile"
    - name: OPENID_REDIRECT_URI
      value: "https://chat.0xk3m.dev/oauth/oidc/callback"
    - name: OAUTH_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: open-webui-secrets
          key: oauthClientId
    - name: OAUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: open-webui-secrets
          key: oauthClientSecret
    - name: OPENID_PROVIDER_URL
      valueFrom:
        secretKeyRef:
          name: open-webui-secrets
          key: openidProviderUrl

  persistence:
    enabled: true
    size: 5Gi
    accessModes:
      - ReadWriteOnce

  service:
    type: ClusterIP
    port: 80
    containerPort: 8080

  ingress:
    enabled: true
    class: cloudflare-tunnel
    host: chat.0xk3m.dev
    tls: false

external-secret-helper:
  externalSecrets:
    - name: open-webui-secrets
      refreshInterval: 1h
      data:
        - secretKey: s3BucketName
          remoteRef:
            key: app/openweb-ui
            property: s3BucketName
        - secretKey: s3Region
          remoteRef:
            key: app/openweb-ui
            property: s3Region
        - secretKey: s3AccessKeyId
          remoteRef:
            key: app/openweb-ui
            property: s3AccessKeyId
        - secretKey: s3SecretAccessKey
          remoteRef:
            key: app/openweb-ui
            property: s3SecretAccessKey
        - secretKey: oauthClientId
          remoteRef:
            key: app/openweb-ui
            property: oauthClientId
        - secretKey: oauthClientSecret
          remoteRef:
            key: app/openweb-ui
            property: oauthClientSecret
        - secretKey: openidProviderUrl
          remoteRef:
            key: app/openweb-ui
            property: openidProviderUrl
