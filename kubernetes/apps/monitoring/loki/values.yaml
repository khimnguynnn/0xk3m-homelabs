loki:
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage:
      type: s3
      bucketNames:
        chunks: 0xk3m-loki-logs
        ruler: 0xk3m-loki-logs
        admin: 0xk3m-loki-logs
      s3:
        region: ap-southeast-1
        insecure: false

  singleBinary:
    replicas: 1
    extraEnv:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: loki-s3-secrets
            key: S3_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: loki-s3-secrets
            key: S3_SECRET_ACCESS_KEY
      - name: AWS_REGION
        value: ap-southeast-1
      - name: AWS_DEFAULT_REGION
        value: ap-southeast-1
    persistence:
      enabled: false

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  gateway:
    enabled: false

  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  test:
    enabled: false

  lokiCanary:
    enabled: false

external-secret-helper:
  externalSecrets:
    - name: loki-s3-secrets
      refreshInterval: 1h
      data:
        - secretKey: S3_ACCESS_KEY_ID
          remoteRef:
            key: monitoring/loki
            property: s3AccessKeyId
        - secretKey: S3_SECRET_ACCESS_KEY
          remoteRef:
            key: monitoring/loki
            property: s3SecretAccessKey
