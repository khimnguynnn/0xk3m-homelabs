loki:
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage:
      type: s3
      bucketNames:
        chunks: 0xk3m-loki-logs
        ruler: 0xk3m-loki-logs
        admin: 0xk3m-loki-logs
        accessKeyId: ${S3_ACCESS_KEY_ID}
        secretAccessKey: ${S3_SECRET_ACCESS_KEY}
      s3:
        region: ap-southeast-1
        insecure: false

  singleBinary:
    replicas: 1
    extraEnvFrom:
      - secretRef:
          name: loki-s3-secrets
    persistence:
      enabled: true
      size: 5Gi

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  gateway:
    enabled: false

  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  test:
    enabled: false

  lokiCanary:
    enabled: false

external-secret-helper:
  externalSecrets:
    - name: loki-s3-secrets
      refreshInterval: 1h
      data:
        - secretKey: S3_ACCESS_KEY_ID
          remoteRef:
            key: monitoring/loki
            property: s3AccessKeyId
        - secretKey: S3_SECRET_ACCESS_KEY
          remoteRef:
            key: monitoring/loki
            property: s3SecretAccessKey
