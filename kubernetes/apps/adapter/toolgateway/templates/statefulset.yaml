apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: toolgateway
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: toolgateway-service
  replicas: 1
  selector:
    matchLabels:
      adapter/type: mcp
  template:
    metadata:
      labels:
        adapter/type: mcp
    spec:
      serviceAccountName: mcpgateway-sa
      containers:
        - name: toolgateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: Redis__ConnectionString
              value: {{ .Values.redis.connectionString | quote }}
            - name: GatewaySettings__Secret
              value: {{ .Values.gatewaySecret | quote }}
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: false
