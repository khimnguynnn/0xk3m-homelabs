app:
  image:
    repository: h4ckf0r0day/obscura
    tag: "0.2.2"
    pullPolicy: IfNotPresent

  replicaCount: 1

  args:
    - mcp
    - --http
    - --host
    - "0.0.0.0"
    - --port
    - "3000"

  service:
    type: ClusterIP
    port: 3000

  livenessProbe:
    httpGet:
      path: /mcp
      port: http
      httpHeaders:
        - name: Accept
          value: text/event-stream
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe: null

  env:
    - name: OBSCURA_NAV_TIMEOUT_MS
      value: "15000"
    - name: OBSCURA_SCRIPT_DEADLINE_MS
      value: "15000"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "2"
      memory: 1Gi
