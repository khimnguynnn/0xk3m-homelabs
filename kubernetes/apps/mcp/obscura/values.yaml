app:
  image:
    repository: h4ckf0r0day/obscura
    tag: "0.2.2"
    pullPolicy: IfNotPresent

  replicaCount: 1

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false  # chromium needs writable dirs

  args:
    - mcp
    - --http
    - --host
    - "0.0.0.0"
    - --port
    - "3000"

  service:
    type: ClusterIP
    port: 3000

  livenessProbe: null
  readinessProbe: null

  env:
    - name: OBSCURA_NAV_TIMEOUT_MS
      value: "15000"
    - name: OBSCURA_SCRIPT_DEADLINE_MS
      value: "15000"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "2"
      memory: 1Gi
