app:
  image:
    repository: hashicorp/terraform-mcp-server
    tag: latest
    pullPolicy: Always

  replicaCount: 1

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  args:
    - streamable-http
    - --transport-host=0.0.0.0
    - --transport-port=8080
    - --toolsets=all

  service:
    type: ClusterIP
    port: 8080

  livenessProbe: null
  readinessProbe: null

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  ingress:
    enabled: false
