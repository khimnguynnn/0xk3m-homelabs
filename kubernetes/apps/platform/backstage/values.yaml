backstage:
  replicas: 1

  image:
    registry: ghcr.io
    repository: backstage/backstage
    tag: latest
    pullPolicy: IfNotPresent

  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  appConfig:
    app:
      title: 0xk3m Homelab
      baseUrl: https://backstage.0xk3m.dev

    backend:
      baseUrl: https://backstage.0xk3m.dev
      listen:
        port: 7007
      csp:
        connect-src: ["'self'", "http:", "https:"]
      cors:
        origin: https://backstage.0xk3m.dev
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true

    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Domain, Group, User]
      locations: []

  ingress:
    enabled: true
    className: cloudflare-tunnel
    annotations:
      cloudflare-tunnel-ingress-controller.cfargotunnel.com/enabled: "true"
    host: backstage.0xk3m.dev
    path: /
    tls:
      enabled: false

  service:
    type: ClusterIP
    ports:
      backend: 7007

  postgresql:
    enabled: true
    auth:
      username: backstage
      database: backstage
      existingSecret: backstage-secrets
      secretKeys:
        userPasswordKey: postgresPassword

external-secret-helper:
  externalSecrets:
    - name: backstage-secrets
      refreshInterval: 1h
      data:
        - secretKey: postgresPassword
          remoteRef:
            key: platform/backstage
            property: postgresPassword
