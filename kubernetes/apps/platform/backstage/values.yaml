backstage:
  backstage:
    replicas: 1

    image:
      registry: docker.io
      repository: khimnguynn/backstage
      tag: latest
      pullPolicy: Always

    containerSecurityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000

    extraEnvVarsSecrets:
      - backstage-secrets

    extraEnvVars:
      - name: APP_CONFIG_app_baseUrl
        value: "https://backstage.0xk3m.dev"
      - name: APP_CONFIG_backend_baseUrl
        value: "https://backstage.0xk3m.dev"
      - name: POSTGRES_HOST
        value: "backstage-postgresql"
      - name: POSTGRES_PORT
        value: "5432"
      - name: POSTGRES_USER
        value: "backstage"
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: backstage-secrets
            key: user-password

    appConfig:
      app:
        title: 0xk3m Homelab
        baseUrl: https://backstage.0xk3m.dev
        packageName: example-app
      auth:
        environment: homelab
        providers:
          google:
            homelab:
              clientId: ${GOOGLE_CLIENT_ID}
              clientSecret: ${GOOGLE_CLIENT_SECRET}
              signIn:
                resolvers:
                  - resolver: emailMatchingUserEntityAnnotation
                    params:
                      dangerouslyAllowSignInWithoutUserInCatalog: true
      backend:
        baseUrl: https://backstage.0xk3m.dev
        listen:
          port: 7007
        database:
          client: pg
          connection:
            host: ${POSTGRES_HOST}
            port: ${POSTGRES_PORT}
            user: ${POSTGRES_USER}
            password: ${POSTGRES_PASSWORD}
        csp:
          connect-src: ["'self'", "http:", "https:"]
        cors:
          origin: https://backstage.0xk3m.dev
          methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
          credentials: true

      catalog:
        rules:
          - allow:
              [Component, System, API, Resource, Location, Domain, Group, User]
        locations:
          - type: url
            target: https://raw.githubusercontent.com/khimnguynnn/0xk3m-homelabs/main/kubernetes/apps/platform/backstage/catalog/users.yaml

  ingress:
    enabled: true
    className: cloudflare-tunnel
    annotations:
      cloudflare-tunnel-ingress-controller.cfargotunnel.com/enabled: "true"
    host: backstage.0xk3m.dev
    path: /
    tls:
      enabled: false

  service:
    type: ClusterIP
    ports:
      backend: 7007

  postgresql:
    enabled: true
    auth:
      username: backstage
      database: backstage
      existingSecret: backstage-secrets
      secretKeys:
        adminPasswordKey: admin-password
        userPasswordKey: user-password

external-secret-helper:
  externalSecrets:
    - name: backstage-secrets
      refreshInterval: 1h
      data:
        - secretKey: admin-password
          remoteRef:
            key: platform/backstage
            property: postgresPassword
        - secretKey: user-password
          remoteRef:
            key: platform/backstage
            property: postgresPassword
        - secretKey: GOOGLE_CLIENT_ID
          remoteRef:
            key: platform/backstage
            property: GOOGLE_CLIENT_ID
        - secretKey: GOOGLE_CLIENT_SECRET
          remoteRef:
            key: platform/backstage
            property: GOOGLE_CLIENT_SECRET
