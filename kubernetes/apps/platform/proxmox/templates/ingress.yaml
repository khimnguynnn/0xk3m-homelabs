apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxmox-server
  annotations:
    cloudflare-tunnel-ingress-controller.cfargotunnel.com/enabled: "true"
    cloudflare-tunnel-ingress-controller.cfargotunnel.com/backend-protocol: "https"
    cloudflare-tunnel-ingress-controller.cfargotunnel.com/proxy-ssl-verify: "off"
spec:
  rules:
  - host: "proxmox.0xk3m.dev"
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: proxmox-ip-svc
            port:
              number: 8006
